<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efede4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d0a" media="(prefers-color-scheme: dark)" />
    <title>{{title}} · Strckro</title>
    <script>
      (function () {
        var theme = "";
        try {
          theme = localStorage.getItem("strckro.theme") || "";
        } catch (error) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/ui/brand/favicon.svg" />
    <link rel="stylesheet" href="/ui/css/tokens.css" />
    <link rel="stylesheet" href="/ui/css/components.css" />
    <link rel="stylesheet" href="/ui/css/shell.css" />
    <link rel="stylesheet" href="/ui/css/screens.css" />
    <link rel="modulepreload" href="/ui/core/dom.js" />
    <script type="module" src="/ui/main.js"></script>
  </head>
  <body data-page="{{page}}" data-view="{{view}}">
    <div id="strckro">
      <div class="skeleton boot" role="status">
        <span></span>
        <span></span>
        <span></span>
        <p>Opening your workspace…</p>
      </div>
      {{{body}}}
    </div>
    <div id="notifications" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>

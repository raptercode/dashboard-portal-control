<section class="page" data-page="credentials">
  <header class="page-header">
    <div>
      <h1 class="page-title">Credentials</h1>
      <p class="page-subtitle">Git tokens, encrypted at rest</p>
    </div>
  </header>
  <section class="panel">
    <header class="panel-head">
      <h2>เพิ่ม HTTPS token</h2>
      <p>แสดงครั้งเดียว ไม่ส่งกลับทาง API</p>
    </header>
    <form id="credential-form" class="form-grid">
      <label for="credential-name">ชื่อ Credential<input id="credential-name" name="name" pattern="[a-z][a-z0-9\-]{0,79}" maxlength="80" placeholder="github-personal" required></label>
      <label for="credential-host">Git host<input id="credential-host" name="host" maxlength="253" value="github.com" placeholder="github.com" required><small class="field-hint">token นี้จะใช้ได้เฉพาะ repository บน host นี้</small></label>
      <label for="credential-token">Personal access token<input id="credential-token" name="token" type="password" maxlength="4096" autocomplete="new-password" required></label>
      <label class="check-row"><input id="credential-default" name="defaultCredential" type="checkbox"><span><b>ใช้เป็น default credential</b><small>เลือกอัตโนมัติเมื่อสร้างโปรเจคจาก HTTPS repository</small></span></label>
      <div class="form-actions"><button type="submit">บันทึก token</button></div>
    </form>
  </section>
  <div class="section-head"><h2>ที่บันทึกไว้</h2></div>
  <section id="credentials" class="credential-list" aria-live="polite"></section>
</section>

<section id="boot-view" class="auth-screen" aria-live="polite">
  <div class="auth-panel auth-panel-loading">
    <span class="brand-mark" aria-hidden="true">DP</span>
    <div class="page-loader-spinner" aria-hidden="true"></div>
    <p>กำลังตรวจสอบ session…</p>
  </div>
</section>
<section id="login-view" class="auth-screen" hidden>
  <div class="auth-panel">
    <span class="brand-mark" aria-hidden="true">DP</span>
    <h1>เข้าสู่ระบบ</h1>
    <p class="lede">Dashboard Portal สำหรับควบคุมโฮสต์ของคุณ</p>
    <form id="login-form">
      <label for="login-email">อีเมล<input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label for="password">รหัสผ่าน<input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></label>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
    <p id="login-error" class="form-error" role="alert"></p>
  </div>
</section>
<section id="bootstrap-view" class="auth-screen" hidden>
  <div class="auth-panel">
    <span class="brand-mark" aria-hidden="true">DP</span>
    <h1>ตั้งค่าเจ้าของระบบ</h1>
    <p class="lede">สร้างบัญชีเจ้าของครั้งแรกด้วยอีเมลและรหัสผ่านที่แข็งแรง</p>
    <form id="bootstrap-form">
      <label for="bootstrap-email">อีเมล<input id="bootstrap-email" name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label for="bootstrap-current" id="bootstrap-current-wrap" hidden>รหัสผ่านจากตัวติดตั้ง<input id="bootstrap-current" name="currentPassword" type="password" autocomplete="current-password" maxlength="128"></label>
      <label for="bootstrap-password">รหัสผ่านใหม่<small class="field-hint" id="bootstrap-password-hint">อย่างน้อย 12 ตัวอักษร มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์</small><input id="bootstrap-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="bootstrap-password-hint" required></label>
      <label for="bootstrap-confirm">ยืนยันรหัสผ่านใหม่<input id="bootstrap-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
      <button type="submit">สร้างบัญชีเจ้าของ</button>
    </form>
    <p id="bootstrap-error" class="form-error" role="alert"></p>
  </div>
</section>

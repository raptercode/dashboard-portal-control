<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8fafc">
    <title>{{title}} · Dashboard Portal</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('hostmgr.theme');
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0b1220');
          }
        } catch (e) { /* localStorage unavailable */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/admin.css">
    <link rel="stylesheet" href="/ui/v2-source.css">
    <link rel="stylesheet" href="/ui/v2-compat.css">
  </head>
  <body data-app="mail" data-page="{{page}}" data-view="{{view}}" data-flow-mode="{{flowMode}}" data-edit-slug="{{editSlug}}">
    {{> partials/icons.html}}
    <main class="app-shell">
      {{> partials/auth-views.html}}
      <section id="dashboard-view" class="mail-app" hidden>
        <header class="topbar mail-app-topbar">
          <div class="topbar-left">
            <a class="brand" href="/" aria-label="กลับไป Dashboard Portal">
              <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path d="M16 3A13 13 0 1 1 5.5 8.5" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
                <path d="M16 8A8 8 0 1 1 9.5 11" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
                <circle cx="16" cy="16" r="3" fill="#10B981"/>
              </svg>
              <span>Mail</span>
              <small class="mail-app-product">Dashboard Portal</small>
            </a>
            <div class="breadcrumb"><span>host</span><code id="host-breadcrumb">—</code></div>
          </div>
          <div class="topbar-right">
            <a class="mail-portal-link" href="/"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg><span>Portal</span></a>
            <span id="tls-badge" class="tls-badge"><span class="dot"></span>TLS active</span>
            <button id="theme-toggle" class="close-btn theme-toggle" type="button" aria-label="สลับเป็นโหมดมืด" title="สลับเป็นโหมดมืด">
              <svg class="icon" aria-hidden="true"><use href="#icon-moon"></use></svg>
            </button>
            <div id="owner-avatar" class="avatar" title="Portal owner">AD</div>
          </div>
        </header>
        <main class="main mail-app-main">
          {{{body}}}
        </main>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
